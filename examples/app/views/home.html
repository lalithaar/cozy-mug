{{define "title"}}Notes - cozy-mug{{end}}
{{define "content"}}
<h1>Notes</h1>
{{with .Values.flash}}<p class="flash">{{.}}</p>{{end}}
<form method="post" action="{{.URL "notes.create"}}">
  {{.CSRF}}
  <label>Title <input name="title" required></label>
  <label>Body <textarea name="body" rows="3"></textarea></label>
  <button type="submit">Add note</button>
</form>
<p>{{len .Notes}} {{pluralize (len .Notes) "note" "notes"}}</p>
<ul>
{{range $i, $n := .Notes}}
  <li class="{{cycle $i "odd" "even"}}">
    {{counter $i}}. <a href="{{$.URL "note" "id" $n.ID}}">{{$n.Title}}</a>
    {{template "note-body" $n}}
  </li>
{{end}}
</ul>
{{end}}
